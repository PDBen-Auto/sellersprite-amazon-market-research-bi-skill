name: Publish installable skill release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies and test
        run: |
          python -m pip install -r requirements.txt
          python -m unittest discover -s sellersprite-bi-market-research/scripts -p "test_*.py" -v
          python tests/test_install_smoke.py
      - name: Package installable skill
        shell: bash
        run: |
          mkdir -p dist/sellersprite-bi-market-research
          git archive --format=tar "${GITHUB_SHA}" | tar -x -C dist/sellersprite-bi-market-research
          find dist -type d -name __pycache__ -prune -exec rm -rf {} +
          find dist -type f -name '*.pyc' -delete
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path("dist/sellersprite-bi-market-research")
          manifest = (root / "PUBLIC_MANIFEST.sha256").read_text(encoding="utf-8")
          payload = json.loads((root / "RELEASE_PROVENANCE.json").read_text(encoding="utf-8"))
          assert hashlib.sha256(manifest.encode()).hexdigest() == payload["manifest_sha256"]
          for line in manifest.splitlines():
              digest, relative = line.split("  ", 1)
              assert hashlib.sha256((root / relative).read_bytes()).hexdigest() == digest, relative
          PY
          cd dist/sellersprite-bi-market-research
          zip -r ../sellersprite-amazon-market-research-bi-skill.zip .
          cd ..
          unzip -l sellersprite-amazon-market-research-bi-skill.zip | grep -q 'SKILL.md'
          ! unzip -l sellersprite-amazon-market-research-bi-skill.zip | grep -q 'sellersprite-bi-market-research/sellersprite-bi-market-research/'
          sha256sum sellersprite-amazon-market-research-bi-skill.zip > sellersprite-amazon-market-research-bi-skill.zip.sha256
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ github.ref_name }}"
          dist/sellersprite-amazon-market-research-bi-skill.zip
          dist/sellersprite-amazon-market-research-bi-skill.zip.sha256
          --repo "${{ github.repository }}"
          --title "SellerSprite Amazon Market Research BI Skill ${{ github.ref_name }}"
          --generate-notes
