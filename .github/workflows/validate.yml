name: Validate skill

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run script tests
        run: python -m unittest discover -s sellersprite-bi-market-research/scripts -p "test_*.py" -v
      - name: Compile scripts
        run: python -m compileall -q sellersprite-bi-market-research/scripts
      - name: Smoke-test installable ZIP layout
        run: python tests/test_install_smoke.py
      - name: Validate root skill metadata
        run: python -c "from pathlib import Path; t=Path('SKILL.md').read_text(); assert t.startswith('---'); assert '## Inputs' in t and '## Outputs' in t"
